name: scan-jobs
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay it a little)
  workflow_dispatch:          # lets you press "Run workflow" by hand
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4        # keeps the database between runs
        with:
          path: data
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-
      - run: node bot.js --once && node export.js
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
      - run: mkdir upload && cp public/jobs.json upload/    # upload only jobs.json, nothing else
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5          # sends jobs.json to your website by FTP
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./upload/
